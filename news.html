<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>뉴스 검색 - 생곡소각장 NEWS MONITOR</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<header class="sub-header">

    <div class="container">

        <nav class="top-nav">

            <a href="./index.html" class="brand dark-brand">
                <span class="brand-mark">S</span>

                <span>
                    <strong>SAENGGOK</strong>
                    <small>NEWS MONITOR</small>
                </span>
            </a>

            <a href="./index.html" class="nav-news">
                ← 대시보드
            </a>

        </nav>

    </div>

</header>


<main class="container news-page">

    <div class="page-title">

        <div class="section-kicker">NEWS SEARCH</div>

        <h1>생곡소각장 뉴스 검색</h1>

        <p>
            네이버 뉴스 검색 API를 통해 관련 기사를 조회합니다.
        </p>

    </div>


    <!-- 검색 -->
    <section class="search-box">

        <div class="search-row">

            <div class="search-input-wrap">

                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    value="생곡소각장"
                    placeholder="검색어를 입력하세요."
                    autocomplete="off"
                >

                <button id="clearButton" class="clear-button" type="button">
                    ×
                </button>

            </div>

            <select id="sortSelect" class="sort-select">
                <option value="date">최신순</option>
                <option value="sim">관련도순</option>
            </select>

            <button id="searchButton" class="search-button">
                검색
            </button>

        </div>


        <div class="search-period">

            <div class="period-buttons" id="periodButtons">

                <button class="period-btn" data-days="7">1주일</button>
                <button class="period-btn active" data-days="30">1개월</button>
                <button class="period-btn" data-days="90">3개월</button>
                <button class="period-btn" data-days="180">6개월</button>
                <button class="period-btn" data-days="365">1년</button>

            </div>

        </div>

    </section>


    <!-- 결과 정보 -->
    <div class="result-toolbar">

        <div class="result-summary">

            <strong id="resultCount">-</strong>
            건

            <span id="searchPeriod">
                검색 기간 확인 중...
            </span>

        </div>

        <div id="searchStatus">
            -
        </div>

    </div>


    <!-- 뉴스 -->
    <section id="newsResults" class="news-results">

        <div class="loading-box">
            뉴스를 불러오는 중입니다...
        </div>

    </section>


    <!-- 페이지네이션 -->
    <div class="pagination-area">

        <button id="prevButton" class="page-button" disabled>
            ← 이전
        </button>

        <span id="pageInfo">1</span>

        <button id="nextButton" class="page-button">
            다음 →
        </button>

    </div>

</main>


<footer class="site-footer">
    <div class="container">

        <div>
            <strong>SAENGGOK NEWS MONITOR</strong>
            <span>부산 생곡소각장 이슈 모니터</span>
        </div>

        <div class="footer-right">
            NAVER API HUB 기반
        </div>

    </div>
</footer>


<script src="./js/news.js"></script>

</body>
</html>
